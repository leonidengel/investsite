name: Deploy Worker

# Авто-деплой worker'а «portfolio» при каждом пуше в main (и вручную).
# Раньше деплой запускался командой вручную — теперь CI делает это сам.
# Секреты: CLOUDFLARE_API_TOKEN (токен с правами "Edit Cloudflare Workers")
# и CLOUDFLARE_ACCOUNT_ID (см. npx wrangler whoami).

on:
  push:
    branches: [main]
  workflow_dispatch: {} # ручной запуск

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy
